<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    width: 1280px; height: 640px; margin: 0; overflow: hidden;
    background: radial-gradient(1200px 620px at 30% 30%, #16222e 0%, #0a0e12 70%);
    font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; color: #c8d6e0;

  h1 { margin: 0; font-size: 64px; letter-spacing: 1px; font-weight: 800; }
  .accent { color: #37d6f0; }
  .prompt { color: #39ff88; }
  p { margin: 0; color: #55707f; font-size: 26px; letter-spacing: .3px; }
</style>
</head>
<body>
  <img src="../extension/porthole-white.png">
  <h1><span class="prompt">&gt;_</span> PORT<span class="accent">HOLE</span></h1>

</html>
